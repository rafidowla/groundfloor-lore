<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <title>Lore — Knowledge Graph</title>
  <defs>
    <linearGradient id="lore-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="lore-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="lore-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Subtle ambient glow behind the whole mark -->
  <circle cx="24" cy="24" r="22" fill="url(#lore-glow)"/>

  <!-- Connecting edges form the triangle (graph relations) -->
  <g stroke="url(#lore-edge)" stroke-width="2.2" stroke-linecap="round">
    <line x1="12" y1="15" x2="36" y2="15"/>
    <line x1="12" y1="15" x2="24" y2="37"/>
    <line x1="36" y1="15" x2="24" y2="37"/>
  </g>

  <!-- Three graph nodes (vertices / knowledge atoms) -->
  <g fill="url(#lore-node)">
    <circle cx="12" cy="15" r="5.5"/>
    <circle cx="36" cy="15" r="5.5"/>
    <circle cx="24" cy="37" r="5.5"/>
  </g>

  <!-- Inner highlights — suggest depth, make the nodes feel dimensional -->
  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="10.5" cy="13.5" r="1.6"/>
    <circle cx="34.5" cy="13.5" r="1.6"/>
    <circle cx="22.5" cy="35.5" r="1.6"/>
  </g>
</svg>
